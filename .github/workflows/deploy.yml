name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
        env:
          VITE_SUPABASE_URL: "https://c--f112e551-c430-46ab-9128-fb7217831cbf-prod.lovable.cloud"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_7-ijXZ0OuXVs7uVI-rz-qA_B2V6NqY7"
          VITE_SUPABASE_PROJECT_ID: "iwsduijpiwjsbkebtwnq"
      - name: Achar a pasta do build
        id: dir
        run: |
          if [ -f dist/client/index.html ]; then echo "path=dist/client" >> $GITHUB_OUTPUT
          elif [ -f .output/public/index.html ]; then echo "path=.output/public" >> $GITHUB_OUTPUT
          else echo "index.html não encontrado"; find dist .output -maxdepth 3 2>/dev/null; exit 1; fi
      - name: Fallback para rotas (404 = index)
        run: cp ${{ steps.dir.outputs.path }}/index.html ${{ steps.dir.outputs.path }}/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.dir.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
